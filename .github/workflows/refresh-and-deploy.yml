name: Deploy frontend

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect Bilibili public data
        env:
          LOOKBACK_DAYS: '3650'
          MAX_VIDEOS_PER_PLATFORM: '240'
          LIBRARY_LIMIT_PER_PLATFORM: '400'
        run: npm run collect

      - name: Collect YouTube public data without API key
        env:
          MAX_YOUTUBE_VIDEOS: '240'
          LIBRARY_LIMIT_PER_PLATFORM: '400'
        run: npm run collect:youtube

      - name: Re-apply duration and relevance rules
        run: npm run sanitize

      - name: Run screening tests
        run: npm test

      - name: Save refreshed rankings and snapshots
        run: |
          if ! git diff --quiet -- public/data/rankings.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/rankings.json
            git commit -m "chore: refresh ASMR rankings data"
            git push origin HEAD:main
          fi

      - name: Build site
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
